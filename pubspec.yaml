name: nossa_patota
description: Gerenciamento da patota de futsal em Flutter.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  supabase_flutter: 2.10.3
  shared_preferences: 2.5.3
  image_picker: 1.2.0
  share_plus: 12.0.1
  url_launcher: 6.3.2
  uuid: 4.5.1
  timezone: 0.11.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/launcher.png
  remove_alpha_ios: true
flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
  assets:
    - assets/demo.json
    - assets/patota_offer.json
    - assets/awards/
    - assets/icon.png
