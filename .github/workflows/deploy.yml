name: Deploy Flutter Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: dart run tool/verify_web_parity.dart
      - name: Conferir configuração e compilar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          ALLOW_DEMO_BUILD: ${{ vars.ALLOW_DEMO_BUILD }}
        shell: bash
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            if [ "$ALLOW_DEMO_BUILD" != "true" ] || [ -n "$SUPABASE_URL$SUPABASE_ANON_KEY" ]; then
              echo 'Configure SUPABASE_URL e SUPABASE_ANON_KEY (os secrets VITE anteriores também são aceitos).'
              exit 1
            fi
          fi
          flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/" --dart-define="SUPABASE_URL=$SUPABASE_URL" --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          dart run tool/prepare_web.dart
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
