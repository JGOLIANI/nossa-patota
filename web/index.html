<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sua patota de futsal: jogadores, partidas, presenças, gols e prêmios.">
  <meta name="theme-color" content="#12833c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nossa Patota">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Nossa Patota</title>
  <style>body { margin: 0; background: #f1f3f5; } #loading { font: 700 20px sans-serif; text-align: center; padding: 35vh 24px; color: #12833c; }</style>
</head>
<body>
  <div id="loading" role="status">Preparando a patota…</div>
  <noscript>Ative o JavaScript para abrir a Nossa Patota.</noscript>
  <script>
    window.addEventListener('flutter-first-frame', () => document.getElementById('loading')?.remove());
    window.addEventListener('load', () => {
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('patota-sw.js').catch(() => {});
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
